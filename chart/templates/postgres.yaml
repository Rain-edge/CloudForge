apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudforge.fullname" . }}-pg
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloudforge.fullname" . }}-pg
  template:
    metadata:
      labels:
        app: {{ include "cloudforge.fullname" . }}-pg
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cloudforge
            - name: POSTGRES_PASSWORD
              value: cloudforge
            - name: POSTGRES_DB
              value: cloudforge
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudforge"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudforge.fullname" . }}-pg
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
  selector:
    app: {{ include "cloudforge.fullname" . }}-pg
