{{- /*
  PostgreSQL 演示 Deployment + Service
  ⚠️  演示用途：单副本、无持久卷、无主从、密码明文
  生产请使用 Bitnami postgresql subchart 或 Zalando Postgres Operator
  Service 名 {{ fullname }}-pg，与 secrets.databaseUrl 中的 host 保持一致
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudforge.fullname" . }}-pg
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloudforge.fullname" . }}-pg
  template:
    metadata:
      labels:
        app: {{ include "cloudforge.fullname" . }}-pg
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cloudforge
            - name: POSTGRES_PASSWORD
              value: cloudforge
            - name: POSTGRES_DB
              value: cloudforge
          readinessProbe:       # PG 真正 accept 连接后才算就绪，避免 app 连接报错
            exec:
              command: ["pg_isready", "-U", "cloudforge"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 5
---
# 集群内部 Service：其它 Pod 通过 cloudforge-pg.<namespace>.svc.cluster.local:5432 访问
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudforge.fullname" . }}-pg
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
  selector:
    app: {{ include "cloudforge.fullname" . }}-pg
