apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudforge.fullname" . }}-alertmanager
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'webhook'
    receivers:
      - name: 'webhook'
        webhook_configs:
          - url: 'https://webhook.site/your-unique-id'  # TODO: replace with your webhook URL
            send_resolved: true
      - name: 'null'
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname']
