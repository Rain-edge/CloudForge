{{- /*
  主 Deployment：稳定版本的 CloudForge 应用
  与金丝雀 Deployment 的区别：
    - 主版本 selector 只有 app=cloudforge（Service 会匹配它和金丝雀）
    - 金丝雀版本多了 component=canary 标签，供 Ingress weight 分流
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudforge.fullname" . }}
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cloudforge.name" . }}
  template:
    metadata:
      # Prometheus 抓取注解（即使没装 ServiceMonitor，kube-prometheus-stack 也会按注解扫）
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: {{ include "cloudforge.name" . }}
    spec:
      terminationGracePeriodSeconds: 30   # 优雅停机：给 uvicorn 30s 处理完连接
      securityContext:
        runAsUser: 65534                 # nobody 用户，非 root 运行
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:                       # 从 ConfigMap + Secret 批量注入环境变量
            - configMapRef:
                name: {{ include "cloudforge.fullname" . }}-config
            - secretRef:
                name: {{ include "cloudforge.fullname" . }}-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:                 # 存活探针：失败就 kill 并重启容器
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:                # 就绪探针：失败就从 Service 摘流
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false   # 禁止 setuid 等提权
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp            # /tmp 是世界可写目录，挂 emptyDir 避免污染镜像层
      volumes:
        - name: tmp
          emptyDir: {}
