apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudforge.fullname" . }}-secret
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  CF_DATABASE_URL: {{ .Values.secrets.databaseUrl | default (printf "postgresql+asyncpg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password .Release.Name .Values.postgresql.auth.database) | quote }}
  CF_REDIS_URL: {{ .Values.secrets.redisUrl | default (printf "redis://%s-redis-master:6379/0" .Release.Name) | quote }}
  CF_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
