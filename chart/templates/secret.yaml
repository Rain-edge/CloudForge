{{- /*
  Secret：机密配置（DB URL、Redis URL、JWT 密钥）
  使用 stringData：直接写明文，K8s 存入 etcd 时自动做 base64 编码
  ⚠️  演示项目做法；生产请使用 Sealed Secrets 或 External Secrets Operator
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudforge.fullname" . }}-secret
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  CF_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  CF_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  CF_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
