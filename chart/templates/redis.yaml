apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudforge.fullname" . }}-redis
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloudforge.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "cloudforge.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudforge.fullname" . }}-redis
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  ports:
    - port: 6379
  selector:
    app: {{ include "cloudforge.fullname" . }}-redis
