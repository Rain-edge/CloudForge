{{- /*
  ConfigMap：非机密应用配置（日志级别、格式等）
  容器以 envFrom.configMapRef 批量注入，变量名 CF_LOG_* 与 pydantic-settings 对齐
  机密配置放 Secret（参见 secret.yaml）
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudforge.fullname" . }}-config
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
data:
  CF_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CF_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  # OTel OTLP/gRPC 端点：K8s 部署时 Tempo 在 monitoring namespace（跨 ns 用 <svc>.<ns>）
  # 本地 compose 由 docker-compose.yml 的 OTEL_EXPORTER_OTLP_ENDPOINT 覆盖（Jaeger）
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
