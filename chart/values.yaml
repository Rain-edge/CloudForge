# Default Helm chart values (merge with --set or -f overrides)
# -- Override the release name
nameOverride: ""
# -- Override the full resource name (includes release name)
fullnameOverride: ""

# -- Number of replicas
replicaCount: 3

image:
  repository: cloudforge--app
  tag: latest
  pullPolicy: Never
service:
  type: LoadBalancer
  port: 8000

ingress:
  enabled: false
  className: nginx
  host: cloudforge.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Application config
config:
  logLevel: "INFO"
  logFormat: "json"

# External services — K8s-native Deployments defined in postgres.yaml / redis.yaml
# (Bitnami subcharts are NOT listed in Chart.yaml → helm won't try to install them)
postgresql:
  enabled: false
redis:
  enabled: false

# Secrets (demo-only; use Sealed Secrets for production)
secrets:
  databaseUrl: "postgresql+asyncpg://cloudforge:cloudforge@cloudforge-pg:5432/cloudforge"
  redisUrl: "redis://cloudforge-redis:6379/0"
  secretKey: "k8s-deploy-dev-key-32-chars!!"

# Canary deployment
canary:
  enabled: false
  weight: 0
  replicas: 1
  tag: latest  # override to deploy a different image version

# Observability
observability:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false

# Grafana dashboard provisioning (requires kube-prometheus-stack with sidecar)
grafanaDashboard:
  enabled: false
