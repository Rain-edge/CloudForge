version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CF_DATABASE_URL=postgresql+asyncpg://cloudforge:cloudforge@postgres:5432/cloudforge
      - CF_REDIS_URL=redis://redis:6379/0
      - CF_SECRET_KEY=dev-secret-key-change-in-production
      - CF_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge
      POSTGRES_DB: cloudforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
