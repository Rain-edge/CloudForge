# CloudForge 本地开发环境 — Docker Compose 编排
# 服务：app（FastAPI）/ postgres / redis
# 启动：docker compose up -d    停止：docker compose down -v
#
# 说明：
#   - 容器间通过服务名（postgres / redis）通信，环境变量对应 CF_ 前缀
#   - depends_on 配合 healthcheck，确保 PG 和 Redis 就绪后再启应用
#   - pgdata 命名卷持久化 PostgreSQL 数据（Redis 当前不持久化，仅作演示缓存/Broker）
#   - app 源码挂载为卷，修改代码无需重建镜像；如需真·热重载请在启动命令加 --reload

version: "3.9"

services:

  # FastAPI 应用
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 容器内用服务名而非 localhost 通信
      - CF_DATABASE_URL=postgresql+asyncpg://cloudforge:cloudforge@postgres:5432/cloudforge
      - CF_REDIS_URL=redis://redis:6379/0
      - CF_SECRET_KEY=dev-***************************tion   # 演示环境密钥，生产必须更换
      - CF_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app            # 修改本地 app/ 代码后容器内同步（无需重建镜像）

  # PostgreSQL 14
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: "cloudforge"      # 演示环境密码，生产使用 secrets 管理
      POSTGRES_DB: cloudforge
    ports:
      - "5432:5432"                # 暴露端口便于 pgAdmin / DBeaver 直连
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready：PG 官方健康检查工具，只在进程可连时返回 0
      test: ["CMD-SHELL", "pg_isready -U cloudforge"]
      interval: 3s
      timeout: 3s
      retries: 5                   # 累计 15s 失败标记为 unhealthy

  # Redis 7（预留缓存 / Celery Broker）
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      # 返回 PONG 表示 Redis 可正常响应
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
